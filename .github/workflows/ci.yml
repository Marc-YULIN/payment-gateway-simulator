name: Build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PaymentSim.slnx
      - run: dotnet build PaymentSim.slnx --no-restore -c Release
      - run: dotnet test PaymentSim.slnx --no-build --no-restore -c Release
